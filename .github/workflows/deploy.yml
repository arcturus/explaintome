name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: jordano.es
          username: francisco
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(node -v)/bin:$PATH"
            cd ~/dev/explaintome
            GIT_SSH_COMMAND="ssh -i ~/.ssh/explaintome_deploy -o StrictHostKeyChecking=no" git pull origin main
            npm install --omit=dev
            pm2 restart explaintome || pm2 start server.js --name explaintome
