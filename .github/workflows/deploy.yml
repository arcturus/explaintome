name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: jordano.es
          username: francisco
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export PATH="/home/francisco/.nvm/versions/node/v22.18.0/bin:$PATH"
            cd ~/dev/explaintome
            GIT_SSH_COMMAND="ssh -i ~/.ssh/explaintome_deploy -o StrictHostKeyChecking=no" git pull origin main
            npm install --omit=dev
            pm2 restart explainme
