name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: jordano.es
          username: francisco
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            source ~/.bashrc
            cd ~/dev/explaintome
            git pull origin main
            npm install --omit=dev
            pm2 restart explaintome || pm2 start server.js --name explaintome
